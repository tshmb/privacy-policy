name: HomeEstimate template catalog

on:
  push:
    branches:
      - main
    paths:
      - home-estimate-app/templates/sources/**
      - home-estimate-app/templates/build_catalog.sh
      - .github/workflows/home-estimate-template-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure build script is executable
        run: chmod +x home-estimate-app/templates/build_catalog.sh

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Rebuild catalog
        run: ./home-estimate-app/templates/build_catalog.sh

      - name: Commit and push catalog update
        run: |
          if git diff --quiet -- home-estimate-app/templates/catalog.json; then
            echo "No catalog update required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add home-estimate-app/templates/catalog.json
          git commit -m "Update HomeEstimate template catalog"
          git push origin main
